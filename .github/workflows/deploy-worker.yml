name: "2 — Опубликовать полную версию Cloudflare"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'planirov' }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME || 'planirov' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TELEGRAM_PREMIUM_INVOICE_URL: ${{ secrets.TELEGRAM_PREMIUM_INVOICE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Получить проект
        uses: actions/checkout@v7

      - name: Подготовить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить код
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit

      - name: Собрать Worker
        run: npm run build

      - name: Создать конфигурацию Cloudflare
        run: node scripts/create-cloudflare-config.mjs

      - name: Применить D1-миграции
        run: >-
          npx wrangler d1 migrations apply
          "$CLOUDFLARE_D1_DATABASE_NAME"
          --remote
          --config wrangler.jsonc

      - name: Подготовить секреты приложения
        id: app-secrets
        run: |
          count="$(node scripts/create-cloudflare-secrets.mjs "$RUNNER_TEMP/planirov-secrets.json")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Опубликовать Worker
        env:
          APP_SECRET_COUNT: ${{ steps.app-secrets.outputs.count }}
        run: |
          if [ "$APP_SECRET_COUNT" -gt 0 ]; then
            npx wrangler deploy \
              --config wrangler.jsonc \
              --secrets-file "$RUNNER_TEMP/planirov-secrets.json"
          else
            npx wrangler deploy --config wrangler.jsonc
          fi
